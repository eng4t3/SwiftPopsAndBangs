[platformio]
src_dir = swift_show_tuning
default_envs = esp32dev

; USB build / flash:   pio run            (also writes firmware.bin + version.json to the repo root)
;                      pio run -t upload
[env:esp32dev]
; Pinned: platform 7.0.1 = Arduino-ESP32 core 2.0.17. An unpinned platform could silently
; move to Arduino core 3.x (breaking API changes) on the next `pio pkg update`.
platform = platformio/espressif32 @ 7.0.1
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_port = COM16
upload_speed = 921600
; Do NOT change: devices in the field cannot change partitions over OTA (2 x 1,310,720-byte app slots)
board_build.partitions = default.csv
extra_scripts = post:scripts/post_build.py

; Wireless flash from a laptop joined to the car Wi-Fi (Swift-PopsAndBangs):
;   pio run -e esp32dev_wifi -t upload
; Uses curl (built into Windows 10/11) to POST the image to the dashboard's /update route,
; with the MD5 so a corrupted transfer is rejected. Other address: --upload-port <ip>
[env:esp32dev_wifi]
extends = env:esp32dev
upload_protocol = custom
upload_port = 192.168.4.1
upload_command = curl --fail-with-body -sS -w "\n" --connect-timeout 10 --max-time 300 -H "Expect:" -F "update=@$SOURCE" "http://$UPLOAD_PORT/update?md5=$OTA_MD5"
